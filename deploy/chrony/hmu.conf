# Servidor de HORA da rede do hospital (chrony). A hora certa importa: auditoria, tempo de espera, senha do dia,
# validade do certificado HTTPS em cada computador e rotação dos backups dependem dela.
#
#   sudo apt install chrony
#   sudo cp deploy/chrony/hmu.conf /etc/chrony/conf.d/hmu.conf   # ajuste a linha "allow" para a faixa da sua rede
#   sudo systemctl restart chrony && chronyc tracking
#
# Com internet: acerta pela hora oficial do Brasil (NTP.br, Observatório Nacional).
server a.st1.ntp.br iburst
server b.st1.ntp.br iburst
pool pool.ntp.br iburst

# Logo depois de ligar (ex.: bateria da placa-mãe fraca), corrige saltos grandes de uma vez.
makestep 1 3
# Mantém o relógio da placa-mãe acertado (vale para a próxima falta de energia).
rtcsync

# Sem internet: continua servindo a própria hora, então TODOS os computadores ficam iguais ao servidor.
local stratum 10

# Quem pode perguntar a hora a este servidor: a rede do hospital (ajuste para a sua faixa).
allow 192.168.0.0/24

# Nos computadores Windows (como administrador), apontar para o servidor:
#   w32tm /config /manualpeerlist:"192.168.0.10,0x8" /syncfromflags:manual /reliable:no /update
#   net stop w32time && net start w32time && w32tm /resync
# Em Linux (Raspberry da TV): em /etc/systemd/timesyncd.conf, NTP=192.168.0.10 e systemctl restart systemd-timesyncd
