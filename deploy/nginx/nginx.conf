# Nginx — proxy reverso com HTTPS obrigatório. Uma única origem para Web, API e WebSocket
# (cookies de sessão de mesma origem, sem CORS em produção).
worker_processes auto;
events { worker_connections 2048; }

http {
  server_tokens off;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 1m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # PRIVACIDADE: o log NÃO registra a query string (a busca de pacientes usa ?q= com nome/CPF)
  # nem cabeçalhos/cookies. Só método, caminho, status, tempo e IP.
  log_format privacy '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
  access_log /var/log/nginx/access.log privacy;

  # limite extra contra força bruta no login (a API também limita e bloqueia por usuário)
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # O IP interno de cada serviço muda quando o contêiner é recriado (atualização) ou reinicia depois de uma queda.
  # Resolver pelo DNS do Docker a cada requisição (cache de 10 s) evita o Nginx ficar preso no IP antigo — e ele
  # sobe mesmo que a API/Web ainda não estejam de pé (mostra a página de "aguarde" até ficarem).
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    set $api_upstream http://api:4000;
    set $web_upstream http://web:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # o HSTS é definido aqui; o mesmo cabeçalho vindo da API sairia duplicado
    proxy_hide_header Strict-Transport-Security;

    location = /api/auth/login {
      limit_req zone=login burst=5 nodelay;
      limit_req_status 429;
      proxy_pass $api_upstream;
    }

    location /api/ {
      proxy_set_header Connection "";
      proxy_pass $api_upstream;
      proxy_read_timeout 30s;
    }

    # tempo real (WebSocket com fallback de long-polling)
    location /socket.io/ {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
      proxy_pass $api_upstream;
    }

    location / {
      proxy_set_header Connection "";
      proxy_pass $web_upstream;
      # sistema subindo (volta da energia, atualização): página local que se recarrega sozinha, em vez de um 502
      # parado — importante para a TV do painel, que ninguém fica olhando
      error_page 502 503 504 /aguarde.html;
    }

    location = /aguarde.html {
      internal;
      root /usr/share/nginx/hmu;
      expires -1;
    }
  }
}
